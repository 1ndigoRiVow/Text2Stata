<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2Stata - 智能实证分析代理</title>
    <style>
        :root {
            --primary: #26343f;
            --accent: #2f7fbf;
            --bg: #f3f6f8;
            --surface: #ffffff;
            --border: #dfe7ee;
            --text: #24313b;
            --muted: #6f7f8c;
            --danger: #b33a3a;
            --success: #287a52;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .sidebar {
            width: 330px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .logo-area {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 20px;
            background: var(--primary);
            color: #fff;
        }

        .logo-area h1 { font-size: 1.18rem; margin-bottom: 6px; }
        .logo-area p { font-size: 0.82rem; opacity: 0.82; }

        .section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            margin-bottom: 14px;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 700;
        }

        .upload-btn, .send-btn, .small-btn {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.2s, background 0.2s;
        }

        .upload-btn {
            display: block;
            width: 100%;
            padding: 11px 12px;
            background: var(--accent);
            color: #fff;
            text-align: center;
        }

        .upload-btn:hover, .send-btn:hover, .small-btn:hover { opacity: 0.9; }
        #fileInput { display: none; }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary);
            font-size: 0.83rem;
            font-weight: 700;
        }

        .select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fbfcfd;
            color: var(--text);
            outline: none;
        }

        .select:focus { border-color: var(--accent); }

        .main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 26px;
        }

        .message {
            max-width: 92%;
            padding: 15px 18px;
            border-radius: 8px;
            line-height: 1.55;
            box-shadow: 0 2px 7px rgba(31, 45, 61, 0.06);
        }

        .msg-system {
            align-self: flex-start;
            background: var(--surface);
            border-left: 4px solid var(--accent);
        }

        .msg-user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }

        .input-area {
            display: flex;
            gap: 14px;
            align-items: flex-end;
            padding: 18px 26px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .input-box {
            min-height: 58px;
            max-height: 145px;
            flex: 1;
            resize: vertical;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 1rem;
            outline: none;
        }

        .input-box:focus { border-color: var(--accent); }

        .send-btn {
            height: 58px;
            padding: 0 24px;
            background: var(--primary);
            color: #fff;
            font-size: 0.96rem;
        }

        .send-btn:disabled {
            background: #aab5bd;
            cursor: not-allowed;
        }

        .plan-box, .result-box {
            display: grid;
            gap: 10px;
        }

        .kv {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 10px;
            font-size: 0.92rem;
        }

        .kv span:first-child {
            color: var(--muted);
            font-weight: 700;
        }

        .code-box, .log-box {
            max-height: 360px;
            overflow: auto;
            padding: 12px;
            border-radius: 6px;
            background: #17212b;
            color: #dbe6ee;
            white-space: pre-wrap;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.84rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }

        .small-btn {
            padding: 9px 13px;
            background: var(--accent);
            color: #fff;
        }

        .small-btn.secondary {
            background: #e8edf1;
            color: var(--primary);
        }

        .download-link {
            display: inline-block;
            margin: 5px 8px 0 0;
            padding: 8px 12px;
            border-radius: 5px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .status-line { color: var(--muted); font-size: 0.88rem; }
        .ok { color: var(--success); font-weight: 700; }
        .error { color: var(--danger); font-weight: 700; }

        /* 结果体检：只提醒不阻断，所以用"提示卡"而不是错误样式 */
        .audit-box {
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e6d5a8;
        }

        .audit-head {
            padding: 9px 12px;
            background: #fdf6e3;
            color: #8a6d1f;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .audit-item {
            padding: 9px 12px;
            border-top: 1px solid #f0e6cc;
            background: #fffdf7;
        }

        .audit-item .audit-title {
            font-weight: 700;
            color: #8a6d1f;
            font-size: 0.9rem;
        }

        .audit-item.high .audit-title { color: var(--danger); }
        .audit-item.medium .audit-title { color: #a5761a; }
        .audit-item.low .audit-title { color: var(--muted); }

        .audit-item .audit-detail {
            margin-top: 3px;
            font-size: 0.87rem;
            line-height: 1.5;
        }

        .audit-item .audit-evidence {
            margin-top: 4px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.8rem;
            color: var(--muted);
            word-break: break-all;
        }

        .audit-pass {
            margin-top: 8px;
            font-size: 0.88rem;
            color: var(--success);
        }

        /* 环境状态徽章 */
        .badge {
            display: inline-block;
            margin-right: 6px;
            padding: 2px 8px;
            border-radius: 9px;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .badge.ok { background: #e4f4ec; color: var(--success); }
        .badge.warn { background: #fdf3e0; color: #96690f; }

        .settings-link {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fbfcfd;
            color: var(--primary);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }

        .settings-link:hover { border-color: var(--accent); color: var(--accent); }

        /* 设置面板 */
        .settings-backdrop {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(38, 52, 63, 0.45);
        }

        .settings-backdrop.open { display: flex; }

        .settings-panel {
            width: 100%;
            max-width: 580px;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 10px;
            background: var(--surface);
            box-shadow: 0 16px 42px rgba(15, 25, 35, 0.26);
        }

        .settings-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .settings-head h2 { font-size: 1.02rem; color: var(--primary); }

        .settings-body { padding: 20px 22px 4px; }

        .settings-foot {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 22px 20px;
        }

        .settings-hint {
            margin-top: 5px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--muted);
            word-break: break-all;
        }

        .text-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fbfcfd;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        .text-input:focus { border-color: var(--accent); }

        .path-row { display: flex; gap: 8px; }
        .path-row .text-input { flex: 1; }

        .icon-btn {
            padding: 7px 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fbfcfd;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-area">
            <h1>Text2Stata</h1>
            <p>面向经管实证分析的 Stata 代理</p>
        </div>

        <div class="section">
            <label for="fileInput" class="upload-btn" id="uploadBtnText">上传 .dta 数据文件</label>
            <input type="file" id="fileInput" accept=".dta" onchange="handleFileUpload(event)">
            <div id="uploadStatus" class="status-line" style="margin-top: 10px; text-align: center;"></div>
        </div>

        <div class="section">
            <div class="section-title">AI 配置</div>
            <div class="field">
                <label>API 线路</label>
                <select id="sel-line" class="select">
                    <option value="line1">线路 1</option>
                    <option value="line2">线路 2</option>
                    <option value="line3">线路 3</option>
                </select>
            </div>
            <div class="field" style="margin-bottom: 0;">
                <label>模型</label>
                <select id="sel-model" class="select">
                    <option value="gpt-3.5-turbo">GPT-3.5-Turbo</option>
                    <option value="gpt-4o-mini">GPT-4o-Mini</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="deepseek-v3.2">DeepSeek-V3.2</option>
                </select>
            </div>
        </div>

        <div class="section" id="varSettings" style="display: none;">
            <div class="section-title">变量预设</div>
            <div class="field">
                <label>被解释变量 ($y)</label>
                <select id="sel-y" class="select"></select>
            </div>
            <div class="field">
                <label>核心解释变量 ($x)</label>
                <select id="sel-x" class="select"></select>
            </div>
            <div class="field">
                <label>个体标识 ($id)</label>
                <select id="sel-id" class="select"></select>
            </div>
            <div class="field">
                <label>时间标识 ($time)</label>
                <select id="sel-time" class="select"></select>
            </div>
            <div class="field">
                <label>控制变量 ($controls)</label>
                <select id="sel-controls" class="select" multiple style="height: 240px;"></select>
                <div class="status-line" style="margin-top: 5px;">按住 Ctrl 或 Cmd 可多选</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">运行环境</div>
            <div id="envStatus" class="status-line" style="margin-bottom: 12px;">正在检查…</div>
            <button class="settings-link" onclick="openSettings()">设置</button>
        </div>
    </aside>

    <main class="main">
        <div class="chat" id="chatScreen">
            <div class="message msg-system">
                你好，我是 Text2Stata。请先上传 .dta 文件，然后用自然语言描述你想做的分析。我会先生成分析计划，确认后再执行 Stata。
            </div>
        </div>

        <div class="input-area">
            <textarea class="input-box" id="queryInput" placeholder="例如：研究 ESG 分数对 ROA 的影响，控制公司规模和杠杆，做双向固定效应回归。" onkeydown="handleEnter(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="submitAnalysis()">生成计划</button>
        </div>
    </main>

    <div class="settings-backdrop" id="settingsBackdrop">
        <div class="settings-panel">
            <div class="settings-head">
                <h2>设置</h2>
                <button class="icon-btn" onclick="closeSettings()">关闭</button>
            </div>

            <div class="settings-body">
                <div class="field">
                    <label>Stata 可执行文件</label>
                    <div class="path-row">
                        <input type="text" class="text-input" id="cfg-stata" placeholder="留空则自动探测">
                        <button class="icon-btn" onclick="detectStata()">自动探测</button>
                    </div>
                    <div class="settings-hint" id="stataHint"></div>
                </div>

                <div class="field">
                    <label>模型接口地址</label>
                    <input type="text" class="text-input" id="cfg-api-url" placeholder="https://example.com/v1/chat/completions">
                    <div class="settings-hint">任何兼容 OpenAI <code>/v1/chat/completions</code> 的服务都可以，包括各家第三方中转。</div>
                </div>

                <div class="field">
                    <label>API Key</label>
                    <input type="password" class="text-input" id="cfg-key1" style="margin-bottom: 8px;">
                    <input type="password" class="text-input" id="cfg-key2" style="margin-bottom: 8px;">
                    <input type="password" class="text-input" id="cfg-key3">
                    <div class="settings-hint" id="keyHint">留空表示不修改已保存的密钥；密钥只存在本机，不会上传。</div>
                </div>

                <div class="field">
                    <label>默认模型</label>
                    <input type="text" class="text-input" id="cfg-model" placeholder="gpt-4o">
                </div>

                <div class="field">
                    <label>单个数据文件上限（MB）</label>
                    <input type="number" class="text-input" id="cfg-maxmb" min="1" max="2048">
                </div>

                <div class="settings-hint" id="cfgPathHint" style="margin-bottom: 14px;"></div>
            </div>

            <div class="settings-foot">
                <button class="small-btn" onclick="saveSettings()">保存</button>
                <span class="status-line" id="settingsStatus"></span>
            </div>
        </div>
    </div>

    <script>
        const state = {
            file_id: null,
            schema: [],
            isProcessing: false,
            pendingPlan: null,
            currentTaskId: null
        };

        // 打包版由后端直接托管前端，走同源即可；
        // 开发时可能用 file:// 直开，那种情况回落到本机 5000。
        const API_BASE = (location.protocol === "http:" || location.protocol === "https:")
            ? `${location.origin}/api`
            : "http://127.0.0.1:5000/api";

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const btnText = document.getElementById("uploadBtnText");
            const status = document.getElementById("uploadStatus");
            btnText.innerText = "正在读取...";
            status.textContent = "解析数据文件中";

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
                const data = await response.json();
                if (data.status === "success") {
                    state.file_id = data.file_id;
                    state.schema = data.schema;
                    status.innerHTML = `<span class="ok">解析成功：${escapeHtml(file.name)}</span>`;
                    btnText.innerText = "重新选择数据";
                    fillSelects(data.schema);
                    document.getElementById("varSettings").style.display = "block";
                    appendMessage("system", `数据 <b>${escapeHtml(file.name)}</b> 已就绪。现在可以预设变量或直接输入分析需求。`);
                } else {
                    status.innerHTML = `<span class="error">${escapeHtml(data.message)}</span>`;
                    btnText.innerText = "上传失败，重新选择";
                }
            } catch (error) {
                status.innerHTML = `<span class="error">无法连接后端，请确认服务已经启动。</span>`;
                btnText.innerText = "上传失败，重新选择";
            } finally {
                event.target.value = "";
            }
        }

        function fillSelects(schema) {
            const options = `<option value="">让 AI 自动识别</option>` +
                schema.map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${escapeHtml(v.label || "无标签")})</option>`).join("");
            ["sel-y", "sel-x", "sel-id", "sel-time"].forEach(id => {
                document.getElementById(id).innerHTML = options;
            });
            document.getElementById("sel-controls").innerHTML =
                schema.map(v => `<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)}</option>`).join("");
        }

        function collectPayload(query) {
            return {
                query,
                file_id: state.file_id,
                schema: state.schema,
                manual_mappings: {
                    y: document.getElementById("sel-y").value,
                    x: document.getElementById("sel-x").value,
                    id: document.getElementById("sel-id").value,
                    time: document.getElementById("sel-time").value,
                    controls: Array.from(document.getElementById("sel-controls").selectedOptions).map(o => o.value)
                },
                ai_settings: {
                    line: document.getElementById("sel-line").value,
                    model: document.getElementById("sel-model").value
                }
            };
        }

        async function submitAnalysis() {
            if (state.isProcessing) return;
            if (!state.file_id) {
                alert("请先上传数据文件。");
                return;
            }

            const input = document.getElementById("queryInput");
            const query = input.value.trim();
            if (!query) return;

            setLoading(true, "生成中");
            appendMessage("user", escapeHtml(query));

            try {
                const response = await fetch(`${API_BASE}/plan`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(collectPayload(query))
                });
                const plan = await response.json();
                if (plan.status !== "success") {
                    appendMessage("system", `<span class="error">${escapeHtml(plan.message || "生成分析计划失败。")}</span>`);
                    return;
                }
                state.pendingPlan = plan;
                renderPlan(plan);
            } catch (error) {
                appendMessage("system", `<span class="error">请求失败，请检查后端服务。</span>`);
            } finally {
                setLoading(false);
            }
        }

        function renderPlan(plan) {
            const mapping = plan.variable_mapping || {};
            const controls = Array.isArray(mapping.controls) ? mapping.controls.join(", ") : (mapping.controls || "");
            const html = `
                <div class="plan-box">
                    <b>分析计划待确认</b>
                    <div class="kv"><span>模板</span><div><code>${escapeHtml(plan.selected_template)}</code> ${escapeHtml(plan.template_info?.name || "")}</div></div>
                    <div class="kv"><span>数据结构</span><div>${escapeHtml(plan.data_structure)}</div></div>
                    <div class="kv"><span>因变量</span><div>${escapeHtml(mapping.y || "未识别")}</div></div>
                    <div class="kv"><span>核心变量</span><div>${escapeHtml(mapping.x || "未识别")}</div></div>
                    <div class="kv"><span>控制变量</span><div>${escapeHtml(controls || "无")}</div></div>
                    <div class="kv"><span>个体/时间</span><div>${escapeHtml(mapping.id || "无")} / ${escapeHtml(mapping.time || "无")}</div></div>
                    <div class="kv"><span>AI 理由</span><div>${escapeHtml(plan.ai_reasoning || "")}</div></div>
                    <details>
                        <summary>查看将执行的 Stata 代码</summary>
                        <pre class="code-box">${escapeHtml(plan.do_preview || "")}</pre>
                    </details>
                    <div class="actions">
                        <button class="small-btn" onclick="confirmPlan()">确认并执行</button>
                        <button class="small-btn secondary" onclick="cancelPlan()">取消</button>
                    </div>
                </div>`;
            appendMessage("system", html);
        }

        function cancelPlan() {
            state.pendingPlan = null;
            appendMessage("system", "已取消本次分析计划。你可以调整变量或重新输入需求。");
        }

        async function confirmPlan() {
            if (!state.pendingPlan || state.isProcessing) return;
            setLoading(true, "执行中");
            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ plan: state.pendingPlan })
                });
                const data = await response.json();
                if (data.status !== "queued") {
                    appendMessage("system", `<span class="error">${escapeHtml(data.message || "任务提交失败。")}</span>`);
                    setLoading(false);
                    return;
                }
                state.currentTaskId = data.task_id;
                state.pendingPlan = null;
                appendMessage("system", `任务已提交：<code>${escapeHtml(data.task_id)}</code>。正在等待 Stata 返回结果。`);
                pollTask(data.task_id);
            } catch (error) {
                appendMessage("system", `<span class="error">任务提交失败，请检查后端服务。</span>`);
                setLoading(false);
            }
        }

        async function pollTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/task/${taskId}`);
                const task = await response.json();
                if (["queued", "running"].includes(task.status)) {
                    setTimeout(() => pollTask(taskId), 1500);
                    return;
                }

                const result = task.result || task;
                renderResult(result);
                if (state.currentTaskId === taskId) {
                    state.currentTaskId = null;
                    setLoading(false);
                }
            } catch (error) {
                appendMessage("system", `<span class="error">查询任务状态失败。</span>`);
                if (state.currentTaskId === taskId) {
                    state.currentTaskId = null;
                    setLoading(false);
                }
            }
        }

        function renderResult(data) {
            let html = `<div class="result-box">`;
            if (data.ai_reasoning) {
                html += `<div><b>AI 策略：</b>${escapeHtml(data.ai_reasoning)}</div>`;
            }
            if (data.selected_template) {
                html += `<div><b>模板：</b><code>${escapeHtml(data.selected_template)}</code></div>`;
            }

            if (data.status === "success") {
                html += `<p class="ok">执行成功，用时 ${escapeHtml(data.time_cost || 0)} 秒。</p>`;
                if (data.files && data.files.length > 0) {
                    html += `<div><b>结果下载：</b><br>`;
                    data.files.forEach(file => {
                        html += `<a href="${API_BASE}/download/${encodeURIComponent(file)}" class="download-link">下载 ${escapeHtml(file)}</a>`;
                    });
                    html += `</div>`;
                }
            } else {
                html += `<p class="error">执行失败：${escapeHtml(data.message || data.error_code || "未知错误")}</p>`;
            }

            html += renderAudit(data.audit);

            if (data.log) {
                html += `<pre class="log-box">${escapeHtml(data.log)}</pre>`;
            }
            html += `</div>`;
            appendMessage("system", html);
        }

        // 结果体检报告：跑通了不等于结果可用，把异常摆出来但不禁用下载
        function renderAudit(audit) {
            if (!audit) return "";

            if (audit.status === "warning" && audit.warnings && audit.warnings.length > 0) {
                let html = `<div class="audit-box">`;
                html += `<div class="audit-head">结果体检：发现 ${audit.warning_count} 项需要确认（不影响本次结果，请自行判断）</div>`;
                audit.warnings.forEach(item => {
                    html += `<div class="audit-item ${escapeHtml(item.level || "low")}">`;
                    html += `<div class="audit-title">${escapeHtml(item.title)}</div>`;
                    html += `<div class="audit-detail">${escapeHtml(item.detail)}</div>`;
                    if (item.evidence) {
                        html += `<div class="audit-evidence">依据：${escapeHtml(item.evidence)}</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
                return html;
            }

            if (audit.status === "passed") {
                return `<div class="audit-pass">结果体检通过，未发现自相矛盾的指标。</div>`;
            }

            if (audit.message) {
                return `<div class="audit-item low"><div class="audit-detail">${escapeHtml(audit.message)}</div></div>`;
            }
            return "";
        }

        function appendMessage(role, html) {
            const chat = document.getElementById("chatScreen");
            const div = document.createElement("div");
            div.className = `message msg-${role}`;
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function setLoading(loading, text = "生成计划") {
            state.isProcessing = loading;
            document.getElementById("sendBtn").disabled = loading;
            document.getElementById("sendBtn").innerText = loading ? text : "生成计划";
            document.getElementById("queryInput").disabled = loading;
        }

        function handleEnter(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                submitAnalysis();
            }
        }

        // ------------------------------------------------------------------
        // 设置面板
        // 打包版没有 .env 可以手改，这里是配置 Stata 路径与模型密钥的唯一入口。
        // ------------------------------------------------------------------

        function openSettings() {
            document.getElementById("settingsBackdrop").classList.add("open");
            loadSettings();
        }

        function closeSettings() {
            document.getElementById("settingsBackdrop").classList.remove("open");
        }

        function renderEnv(data) {
            const stata = (data && data.stata) || {};
            const chips = [
                stata.ok
                    ? `<span class="badge ok">Stata 就绪</span>`
                    : `<span class="badge warn">Stata 未就绪</span>`,
                data && data.llm_ready
                    ? `<span class="badge ok">模型已配置</span>`
                    : `<span class="badge warn">模型未配置</span>`
            ];
            document.getElementById("envStatus").innerHTML = chips.join("");
            document.getElementById("stataHint").textContent = stata.message || "";
        }

        function syncModelSelect(model) {
            if (!model) return;
            const select = document.getElementById("sel-model");
            if (!Array.from(select.options).some(option => option.value === model)) {
                const option = document.createElement("option");
                option.value = model;
                option.textContent = model;
                select.appendChild(option);
            }
            select.value = model;
        }

        async function loadSettings() {
            const status = document.getElementById("settingsStatus");
            status.textContent = "读取中…";
            try {
                const response = await fetch(`${API_BASE}/config`);
                const data = await response.json();
                const cfg = data.config || {};

                document.getElementById("cfg-stata").value = cfg.stata_path || "";
                document.getElementById("cfg-api-url").value = cfg.api_url || "";
                document.getElementById("cfg-model").value = cfg.default_model || "";
                document.getElementById("cfg-maxmb").value = cfg.max_upload_mb || 100;
                document.getElementById("cfgPathHint").textContent =
                    `配置文件：${cfg.config_file || "（未知）"}`;

                const keys = cfg.keys || [];
                ["cfg-key1", "cfg-key2", "cfg-key3"].forEach((id, index) => {
                    const input = document.getElementById(id);
                    input.value = "";
                    const info = keys[index];
                    input.placeholder = info && info.set
                        ? `已保存：${info.hint}`
                        : `线路 ${index + 1}${index === 0 ? "" : "（可选）"}`;
                });

                renderEnv(data);
                status.textContent = "";
            } catch (error) {
                status.textContent = `读取失败：${error.message}`;
            }
        }

        async function detectStata() {
            const status = document.getElementById("settingsStatus");
            status.textContent = "探测中…";
            try {
                const response = await fetch(`${API_BASE}/stata/detect`);
                const data = await response.json();
                const list = data.candidates || [];
                if (list.length === 0) {
                    status.textContent = "没有找到 Stata，请手动填写 exe 的完整路径。";
                    return;
                }
                document.getElementById("cfg-stata").value = list[0].path;
                const rest = list.slice(1).map(item => item.path);
                status.textContent = rest.length
                    ? `共找到 ${list.length} 个，已填入第 1 个。其余：${rest.join("；")}`
                    : `已填入：${list[0].path}（来源：${list[0].source}）`;
            } catch (error) {
                status.textContent = `探测失败：${error.message}`;
            }
        }

        async function saveSettings() {
            const status = document.getElementById("settingsStatus");
            status.textContent = "保存中…";
            const payload = {
                stata_path: document.getElementById("cfg-stata").value.trim(),
                api_url: document.getElementById("cfg-api-url").value.trim(),
                default_model: document.getElementById("cfg-model").value.trim(),
                max_upload_mb: document.getElementById("cfg-maxmb").value,
                api_keys: {
                    line1: document.getElementById("cfg-key1").value.trim(),
                    line2: document.getElementById("cfg-key2").value.trim(),
                    line3: document.getElementById("cfg-key3").value.trim()
                }
            };
            try {
                const response = await fetch(`${API_BASE}/config`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.status !== "success") {
                    throw new Error(data.message || "保存失败");
                }
                renderEnv(data);
                await loadSettings();
                syncModelSelect(data.config && data.config.default_model);
                status.textContent = "已保存并生效";
                setTimeout(() => { status.textContent = ""; }, 2600);
            } catch (error) {
                status.textContent = `保存失败：${error.message}`;
            }
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeSettings();
        });

        (async function init() {
            try {
                const response = await fetch(`${API_BASE}/config`);
                const data = await response.json();
                renderEnv(data);
                syncModelSelect(data.config && data.config.default_model);
                if (new URLSearchParams(location.search).has("settings")) openSettings();
            } catch (error) {
                document.getElementById("envStatus").innerHTML =
                    `<span class="badge warn">后端未连接</span>`;
            }
        })();
    </script>
</body>
</html>
